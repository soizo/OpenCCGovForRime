schema:
  schema_id: cangjie5_gov
  name: 倉頡五代大陸
  version: 1.0.gov
__include: cangjie5.schema:/
__patch:
  switches:
  - name: ascii_mode
    reset: 0
    states:
    - 中文
    - 西文
    abbrev:
    - 中
    - Ａ
  - name: full_shape
    states:
    - 半角
    - 全角
  - options:
    - gov_traditional
    - simplification
    states:
    - 大陸繁體
    - 简体
    reset: 0
  - name: extended_charset
    states:
    - 常用
    - 增廣
  - name: ascii_punct
    states:
    - 。，
    - ．，
  engine/filters:
  - simplifier
  - simplifier@gov_traditional
  - uniquifier
  - single_char_filter
  gov_traditional:
    option_name: gov_traditional
    opencc_config: govrime_t2gov_keep_simp.json
    tips: none
