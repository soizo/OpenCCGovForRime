schema:
  schema_id: luna_pinyin_gov
  name: 朙月拼音大陸
  version: 0.31.gov
__include: luna_pinyin.schema:/
__patch:
  switches:
  - name: ascii_mode
    reset: 0
    states:
    - 中文
    - 西文
    abbrev:
    - 中
    - Ａ
  - name: full_shape
    states:
    - 半角
    - 全角
  - options:
    - gov_traditional
    - zh_hans
    states:
    - 大陸繁體
    - 简体
    reset: 0
  - name: ascii_punct
    states:
    - 。，
    - ．，
  engine/filters:
  - simplifier@zh_hans
  - simplifier@gov_traditional
  - uniquifier
  gov_traditional:
    option_name: gov_traditional
    opencc_config: govrime_t2gov_keep_simp.json
    tips: none
    excluded_types:
    - reverse_lookup
